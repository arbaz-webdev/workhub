name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/workhub_test
      TEST_DATABASE_APP_URL: postgres://workhub_app:ci_app_password@localhost:5432/workhub_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      - name: Test (includes tenant-isolation tests against real Postgres)
        run: npm test

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  # Builds the deploy images and runs them configured as on Render (render.yaml): the web
  # app proxies /api to the API ("host:port", no scheme), and the API builds its restricted
  # database URL from APP_DB_PASSWORD and migrates a fresh database on start.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f deploy/api.Dockerfile -t workhub-api .

      - name: Build the web image
        run: docker build -f deploy/web.Dockerfile --build-arg API_URL=localhost:4000 -t workhub-web .

      - name: Start both containers
        run: |
          docker run -d --name api --network host \
            -e PORT=4000 \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/workhub \
            -e 'APP_DB_PASSWORD=smoke+test/pass=word==' \
            -e WEB_ORIGIN=http://localhost:3000 -e APP_URL=http://localhost:3000 \
            -e EMAIL_TRANSPORT=console -e ALLOW_CONSOLE_EMAIL=true \
            -e STORAGE_DRIVER=s3 -e S3_BUCKET=smoke -e S3_ENDPOINT=http://localhost:9 \
            -e S3_ACCESS_KEY_ID=smoke -e S3_SECRET_ACCESS_KEY=smoke \
            -e TRUST_PROXY=1 \
            workhub-api
          docker run -d --name web --network host -e PORT=3000 workhub-web

      - name: Sign up through the web app's proxy, as a browser would
        run: |
          for i in $(seq 1 45); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          curl -fsS http://localhost:3000/api/health | grep -q ok
          curl -fsS -o /dev/null http://localhost:3000/sign-in
          curl -fsS -X POST http://localhost:3000/api/auth/sign-up \
            -H 'content-type: application/json' -H 'origin: http://localhost:3000' \
            -d '{"name":"Smoke","email":"smoke@example.com","password":"correct-horse-battery","workspaceName":"Smoke Co"}' \
            -c cookies.txt | grep -q '"workspace"'
          curl -fsS -b cookies.txt http://localhost:3000/api/auth/me | grep -q smoke@example.com
          # Migrations ran once; a restart must find nothing new to apply.
          docker restart api
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/health && break; sleep 2; done
          docker logs api 2>&1 | grep -q 'migrations up to date'

      - name: Container logs
        if: failure()
        run: |
          docker logs api || true
          docker logs web || true

  # The single-container image the free staging site runs (render.yaml): the website and
  # the API together, with the API reachable only from inside the container.
  staging-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build the staging image
        run: docker build -f deploy/staging.Dockerfile -t workhub-staging .

      # Hosted Postgres (Neon) has no superuser: its owner role can create roles and
      # bypass RLS, but not touch SUPERUSER. Run as one, so restarts can't break there.
      - name: Create a Neon-style database owner (no superuser)
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d workhub \
            -c "create role neon_owner login password 'neon_owner_pw' createrole createdb bypassrls" \
            -c "create database neonlike owner neon_owner"

      - name: Start it as Render would
        run: |
          docker run -d --name staging \
            --add-host=host.docker.internal:host-gateway \
            -p 3000:3000 -p 4000:4000 \
            -e NODE_ENV=production -e PORT=3000 \
            -e DATABASE_URL=postgres://neon_owner:neon_owner_pw@host.docker.internal:5432/neonlike \
            -e 'APP_DB_PASSWORD=smoke+test/pass=word==' \
            -e WEB_ORIGIN=http://localhost:3000 -e APP_URL=http://localhost:3000 \
            -e TRUST_PROXY=2 \
            -e EMAIL_TRANSPORT=console -e ALLOW_CONSOLE_EMAIL=true \
            -e STORAGE_DRIVER=s3 -e S3_BUCKET=smoke -e S3_ENDPOINT=http://localhost:9 \
            -e S3_ACCESS_KEY_ID=smoke -e S3_SECRET_ACCESS_KEY=smoke \
            workhub-staging

      - name: Sign up through the website, and check the API isn't reachable from outside
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          curl -fsS http://localhost:3000/api/health | grep -q ok
          curl -fsS -o /dev/null http://localhost:3000/sign-in
          curl -fsS -X POST http://localhost:3000/api/auth/sign-up \
            -H 'content-type: application/json' -H 'origin: http://localhost:3000' \
            -d '{"name":"Smoke","email":"smoke@example.com","password":"correct-horse-battery","workspaceName":"Smoke Co"}' \
            -c cookies.txt | grep -q '"workspace"'
          curl -fsS -b cookies.txt http://localhost:3000/api/auth/me | grep -q smoke@example.com
          # Port 4000 is published, but the API listens on the container's loopback only.
          if curl -sS --max-time 5 http://localhost:4000/health; then echo "API is exposed outside the container"; exit 1; fi
          # If either process stops, the container stops (so the host restarts it).
          docker exec staging bash -c 'for p in /proc/[0-9]*; do if tr "\0" " " < "$p/cmdline" 2>/dev/null | grep -q "dist/main.js"; then kill "${p#/proc/}"; break; fi; done'
          for i in $(seq 1 15); do [ "$(docker inspect -f '{{.State.Running}}' staging)" = "false" ] && break; sleep 1; done
          [ "$(docker inspect -f '{{.State.Running}}' staging)" = "false" ]

      - name: Restart, as Render does after sleeping, and come back healthy
        run: |
          docker start staging
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          curl -fsS http://localhost:3000/api/health | grep -q ok
          docker logs staging 2>&1 | grep -c 'migrations up to date' | grep -q '^2$'
          curl -fsS -b cookies.txt http://localhost:3000/api/auth/me | grep -q smoke@example.com

      - name: Container logs
        if: failure()
        run: docker logs staging || true
