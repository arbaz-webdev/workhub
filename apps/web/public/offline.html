<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · WorkHub</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ecebef; color: #17161a; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { color: #67656d; font-size: 0.95rem; line-height: 1.5; }
      button { margin-top: 1rem; background: #17161a; color: #fff; border: 0; border-radius: 999px; padding: 0.7rem 1.4rem; font-weight: 500; font-size: 0.9rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>WorkHub will be back as soon as you reconnect. Check-ins you made offline are saved on this device and sync by themselves.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
