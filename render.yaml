# Render Blueprint for the staging site: Render dashboard → New → Blueprint → this repo.
# One free web service runs both the website and the API (the API listens only inside
# the container). The database is on Neon and files on Cloudflare R2, both free tiers.
# Free services sleep after 15 minutes without visitors and take about a minute to wake.
# Step-by-step guide: docs/STAGING.md

services:
  - type: web
    name: workhub-staging
    runtime: docker
    dockerfilePath: ./deploy/staging.Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      # Neon's direct (not pooled) connection string for the database owner.
      - key: DATABASE_URL
        sync: false
      # The restricted app user (RLS always applies) is created with this password.
      - key: APP_DB_PASSWORD
        generateValue: true
      # Encrypts two-factor secrets. Generated once; changing it turns off everyone's 2FA.
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      # No REDIS_URL: the single API copy keeps rate limits and live updates in memory.
      # This site's own address; change both if Render gives a different one.
      - key: WEB_ORIGIN
        value: https://workhub-staging.onrender.com
      - key: APP_URL
        value: https://workhub-staging.onrender.com
      # Cloudflare (in front of Render), Render's load balancer, then the website's proxy
      # inside the container. Measured on the live site: with 2 the API saw Cloudflare's IP.
      - key: TRUST_PROXY
        value: '3'
      - key: EMAIL_TRANSPORT
        value: console
      - key: ALLOW_CONSOLE_EMAIL
        value: 'true'
      # A pretend payment gateway, so plans can be tried without moving money. Staging only.
      - key: PAYMENTS_DRIVER
        value: test
      - key: ALLOW_TEST_PAYMENTS
        value: 'true'
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        value: workhub-staging
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        value: https://55d190391c3fbc437f35175a4c776a23.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
